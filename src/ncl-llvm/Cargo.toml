[package]
name = "ncl-llvm"
version = "0.0.0"
edition = "2024"

[features]
default = ["gc-page-heap"]
gc-page-heap = ["ncl-runtime/gc-page-heap"]

[dependencies]
ncl-ir = { path = "../ncl-ir" }
ncl-runtime = { path = "../ncl-runtime", default-features = false }
# MacNCL: vendored stub (see crates/new-asm). defasm errors on aarch64.
new-asm = { path = "../../crates/new-asm" }
# MacNCL: added target-aarch64 for Apple Silicon codegen; kept target-x86.
inkwell = { version = "=0.9.0", default-features = false, features = ["llvm22-1", "target-aarch64", "target-x86"] }
# llvm-sys piggy-backs on inkwell's bundled LLVM. We use it for the
# constructors inkwell doesn't expose: LLVMCreateMCJITCompilerForModule
# (lets us pass a custom memory manager so we can register SEH unwind
# tables on Windows) and LLVMAddGlobalMapping (lets us bind runtime
# helper symbols on our own ExecutionEngineRef without going through
# inkwell's wrapper, which would expect to Drop the engine itself).
#
# Linked dynamically against LLVM-C.dll (formerly `force-static`).
# Every llvm-sys symbol we touch is in the LLVM-C export surface, so
# the static link cost (~100 MB per binary) was buying nothing.  Point
# at the trim install via env: `setx LLVM_SYS_221_PREFIX E:\trimLLVM\install`.
llvm-sys = { version = "=221.0.1", default-features = false }

[lints]
workspace = true
